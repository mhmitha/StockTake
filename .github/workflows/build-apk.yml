name: Build Android APK

on:
  push:
    branches: [ "**" ]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "vendor/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocktake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Stock Take Android app (latest build)"
          body: |
            Automatically built from commit ${{ github.sha }}.

            Download `app-debug.apk` below and open it on your Android phone to install
            it (you'll need to allow "install unknown apps" for whichever app you download
            it with, the first time).

            This is a debug build meant for installing directly on your own device — it
            isn't signed for the Play Store.
          files: android/app/build/outputs/apk/debug/app-debug.apk
